# Builds every commit, which nothing did before this existed.
#
# release-flasher.yml only triggers on a v*.*.* tag, so the first thing that
# ever compiled master was the release itself. A broken commit stayed
# invisible until someone cut a tag, and then it surfaced as a FAILED
# RELEASE -- the worst possible place to find out, because the tag is
# already public by then and has to be deleted and re-pushed.
#
# This is deliberately not a copy of the release job. It builds and stops:
# no merged images, no manifests, no Pages deploy, no release. Just the
# question "does this still compile", answered in about two minutes.
name: Build

on:
  push:
    branches: [master]
    # Documentation and release notes cannot break a build, and the tag
    # workflow covers the release path already.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/release-notes/**'
  pull_request:
  workflow_dispatch: {}

# A second push to master supersedes the first: there is no point finishing
# a build for a commit that is already two behind.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Both caches matter: the toolchain is a ~200MB download and the
      # framework another large unpack, and neither changes between runs.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The board matrix is the authority for CI. Every release profile,
      # including the fast display variants and T-Watch beta, must compile
      # here. The known-boot-looping 3.5-inch development profile stays out
      # of both release and CI until its hardware fault is resolved.
      - name: Validate board matrix and release metadata
        run: |
          python tools/board_matrix.py validate
          python -m py_compile tools/mirror_pages.py

      - name: Build CI board matrix and validate final OTA firmware images
        run: |
          set -euo pipefail
          pio run $(python tools/board_matrix.py pio-args ci)
          # LAB #226 temporary diagnostics: collect the largest linked code
          # symbols BEFORE the unchanged mandatory real-image OTA size gate.
          # Debug symbol reports do not alter firmware or soften failures.
          NM="$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm"
          ELF=".pio/build/cyd-ili9341-fast/firmware.elf"
          if test -x "$NM" && test -s "$ELF"; then
            echo "::group::Largest 50 firmware symbols (linked ELF)"
            "$NM" -S --size-sort --demangle "$ELF" | tail -n 50
            echo "::endgroup::"
            echo "::group::Largest 100 UI/HUNT/LOG/CLEAR symbols"
            "$NM" -S --size-sort --demangle "$ELF" \
              | grep -E 'uiLog|uiClear|category|Category|hunt|Hunt|Theme::|Squachy::|drawTwoBand|armLog' \
              | tail -n 100 || true
            echo "::endgroup::"
          else
            echo "::warning::Size audit nm or firmware ELF not found; OTA gate remains authoritative"
          fi
          python3 tools/check_app_image_sizes.py $(python tools/board_matrix.py list release)

      # LAB firmware only: explicitly avoid production releases and tags.
      - name: Package classic CYD LAB firmware
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p lab-firmware/2.8-ST7789 lab-firmware/3.2-ST7798
          cp .pio/build/cyd/firmware.bin .pio/build/cyd/bootloader.bin .pio/build/cyd/partitions.bin lab-firmware/2.8-ST7789/
          cp .pio/build/cyd32-st7798/firmware.bin .pio/build/cyd32-st7798/bootloader.bin .pio/build/cyd32-st7798/partitions.bin lab-firmware/3.2-ST7798/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" lab-firmware/otadata.bin
          printf 'LAB PR #%s\nPR head: %s\nBuilt checkout: %s\nProfiles: cyd and cyd32-st7798\nDo not publish as production\n' \
            '${{ github.event.pull_request.number }}' '${{ github.event.pull_request.head.sha }}' "$(git rev-parse HEAD)" \
            > lab-firmware/BUILD-INFO.txt
          test "$(stat -c%s lab-firmware/otadata.bin)" -eq 8192
      # Dedicated ESP32-S3 artifact. Do not package this with classic ESP32
      # boards or expose it as an unvalidated production flasher option.
      - name: Package T-Deck Plus experimental LAB firmware
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p lab-tdeck-plus
          cp .pio/build/tdeck-plus/firmware.bin lab-tdeck-plus/firmware.bin
          cp .pio/build/tdeck-plus/bootloader.bin lab-tdeck-plus/bootloader.bin
          cp .pio/build/tdeck-plus/partitions.bin lab-tdeck-plus/partitions.bin
          printf 'EXPERIMENTAL LILYGO T-DECK PLUS\nPR head: %s\nBoard: ESP32-S3 16MB\nGPIO10 power, ST7789 320x240, GT911, keyboard, GPS\nWiFi signatures only; full SquachWatch not yet ported\nDo not flash classic CYD binaries to T-Deck Plus\n' \
            '${{ github.event.pull_request.head.sha }}' > lab-tdeck-plus/BUILD-INFO.txt
      - name: Upload T-Deck Plus LAB firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lab-pr-${{ github.event.pull_request.number }}-tdeck-plus
          path: lab-tdeck-plus/
          if-no-files-found: error
          retention-days: 14
      - name: Package Freenove FNK0104N 3.5 LAB firmware
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p lab-freenove35-st77922
          cp .pio/build/freenove35-st77922/firmware.bin lab-freenove35-st77922/firmware.bin
          cp .pio/build/freenove35-st77922/bootloader.bin lab-freenove35-st77922/bootloader.bin
          cp .pio/build/freenove35-st77922/partitions.bin lab-freenove35-st77922/partitions.bin
          printf 'LAB FNK0104N ESP32-S3 3.5in ST77922 QSPI / touch 0x55\nsource %s\nExperimental display/touch/WiFi signature scanner ONLY\nNo CYD, FNK0104B, or T-Deck firmware may be flashed here.\n' '${{ github.event.pull_request.head.sha }}' > lab-freenove35-st77922/BUILD-INFO.txt
      - name: Upload Freenove 3.5 LAB firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lab-pr-${{ github.event.pull_request.number }}-freenove35-st77922
          path: lab-freenove35-st77922/
          retention-days: 14
          if-no-files-found: error
      - name: Upload classic CYD LAB firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lab-pr-${{ github.event.pull_request.number }}-classic-cyd
          path: lab-firmware/
          if-no-files-found: error
          retention-days: 14


  tests:
    # The decoders are pure arithmetic over byte buffers, so they run on a
    # desktop with no board and no display. Worth a job of their own: the
    # failure mode they cover is a wrong offset producing a plausible
    # coordinate rather than a crash, which no amount of compiling catches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify v1.41 combined Arlo, Privacy, Passive Wi-Fi and Pocket guards
        run: |
          python3 tools/test_v141_arlo_oui.py
          python3 tools/test_v141_privacy_confirm.py
          python3 tools/test_v141_passive_wifi.py
          python3 tools/test_v141_pocket_mode.py
          python3 tools/test_desk_clock_format.py
          python3 tools/test_crowd_none.py
          python3 tools/test_fonts_bisect_a.py
          python3 tools/test_fonts_preview_stage_b.py
          python3 tools/test_fonts_live_render.py
          python3 tools/test_fonts_stage_d.py
          python3 tools/test_fonts_five_steps.py
          python3 tools/test_fonts_button_coverage.py
          python3 tools/test_hunt_footer_buttons.py
          python3 tools/test_shared_draw_two_band.py
          python3 tools/test_category_pill_roster.py
      - name: Verify protected master-context LAB Pages recovery
        run: python3 tools/test_verify_lab_pages_recovery.py
      - name: Reject oversized OTA images and mismatched LAB manifests
        run: |
          python3 tools/test_check_app_image_sizes.py
          python3 tools/test_verify_lab_site_partitions.py
          python3 tools/test_blackbox_ota_layout.py
      - name: Run host tests
        run: make -C test
      - name: Verify upstream v1.48 Phase 1 guards
        run: python3 tools/test_upstream_v148_phase1.py
      - name: Verify classic CYD 2.8 SD-in boot memory safeguards
        run: python3 tools/test_cyd28_sd_boot_memory.py
      - name: Verify R1 renderer unchanged and SD FILES buffered layout
        run: python3 tools/test_cyd28_r1_sd_buffer_r7.py
      - name: Verify CYD 2.8 boot uses buffered recovery and no CRT flashes
        run: python3 tools/test_cyd28_r8_boot_buffer.py
      - name: Verify optimized boot intro frame performance and R7 invariants
        run: python3 tools/test_cyd28_r9_boot_perf.py
      - name: Verify ST7798 frame-clock, boot geometry and native-push safety
        run: python3 tools/test_cyd32_scene_clock_r10.py
      - name: Verify guarded FULL8/HALF8 ST7798 performance and heap fallback
        run: python3 tools/test_cyd32_r11_guarded_full8.py
      - name: Verify CYD32 R12 SD-in boot fallback
        run: python3 tools/test_cyd32_r12_sd_boot_adaptive.py
      - name: Verify v1.50 detector label integration
        run: python3 tools/test_upstream_v150_signatures_r1.py
      - name: Verify full v1.50 detection-library backport
        run: python3 tools/test_upstream_v150_full_detection.py
      - name: Test bounded alert queue
        run: python3 tools/test_alert_queue.py
      - name: Verify Freenove native SquachWatch feature integration
        run: python3 tools/test_freenove_native_ui.py
      - name: Verify Pages historical signature recovery
        run: python3 tools/test_mirror_pages_release_fallback.py
      - name: Verify CYD32 native LCD transfer and one-time rotation clear
        run: python3 tools/test_cyd32_native_push.py

  emulator:
    # Cheap, and it catches the failure mode the merge introduced: the
    # emulator compiles the firmware's own sources against its shims, so a
    # change to a header signature breaks it here rather than the next time
    # somebody tries to render the README animation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the PC emulator
        run: make -C sim -j"$(nproc)"
      - name: Run UI screenshot regression suite
        run: make -C sim regression
