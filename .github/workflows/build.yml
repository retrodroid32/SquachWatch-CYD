# Builds every commit, which nothing did before this existed.
#
# release-flasher.yml only triggers on a v*.*.* tag, so the first thing that
# ever compiled master was the release itself. A broken commit stayed
# invisible until someone cut a tag, and then it surfaced as a FAILED
# RELEASE -- the worst possible place to find out, because the tag is
# already public by then and has to be deleted and re-pushed.
#
# This is deliberately not a copy of the release job. It builds and stops:
# no merged images, no manifests, no Pages deploy, no release. Just the
# question "does this still compile", answered in about two minutes.
name: Build

on:
  push:
    branches: [master, lab/hunt-history-peak-graph-r1-20261111]
    # Documentation and release notes cannot break a build, and the tag
    # workflow covers the release path already.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/release-notes/**'
  pull_request:
  workflow_dispatch: {}

# A second push supersedes the first on the same ref. LAB request pushes
# need an exact-SHA successful Build before any release packaging.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Both caches matter: the toolchain is a ~200MB download and the
      # framework another large unpack, and neither changes between runs.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The board matrix is the authority for CI. Every release profile,
      # including the fast display variants and T-Watch beta, must compile
      # here. The known-boot-looping 3.5-inch development profile stays out
      # of both release and CI until its hardware fault is resolved.
      - name: Validate board matrix and release metadata
        run: |
          python tools/board_matrix.py validate
          python -m py_compile tools/mirror_pages.py

      - name: Build CI board matrix and validate final OTA firmware images
        run: |
          set -euo pipefail
          pio run $(python tools/board_matrix.py pio-args ci)
          python3 tools/check_app_image_sizes.py $(python tools/board_matrix.py list release)

      # LAB firmware only: explicitly avoid production releases and tags.
      - name: Package classic CYD LAB firmware
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p lab-firmware/2.8-ST7789 lab-firmware/3.2-ST7798
          cp .pio/build/cyd/firmware.bin .pio/build/cyd/bootloader.bin .pio/build/cyd/partitions.bin lab-firmware/2.8-ST7789/
          cp .pio/build/cyd32-st7798/firmware.bin .pio/build/cyd32-st7798/bootloader.bin .pio/build/cyd32-st7798/partitions.bin lab-firmware/3.2-ST7798/
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" lab-firmware/otadata.bin
          printf 'LAB PR #%s\nPR head: %s\nBuilt checkout: %s\nProfiles: cyd and cyd32-st7798\nDo not publish as production\n' \
            '${{ github.event.pull_request.number }}' '${{ github.event.pull_request.head.sha }}' "$(git rev-parse HEAD)" \
            > lab-firmware/BUILD-INFO.txt
          test "$(stat -c%s lab-firmware/otadata.bin)" -eq 8192
      - name: Upload classic CYD LAB firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lab-pr-${{ github.event.pull_request.number }}-classic-cyd
          path: lab-firmware/
          if-no-files-found: error
          retention-days: 14


  tests:
    # The decoders are pure arithmetic over byte buffers, so they run on a
    # desktop with no board and no display. Worth a job of their own: the
    # failure mode they cover is a wrong offset producing a plausible
    # coordinate rather than a crash, which no amount of compiling catches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify v1.41 combined Arlo, Privacy, Passive Wi-Fi and Pocket guards
        run: |
          python3 tools/test_v141_arlo_oui.py
          python3 tools/test_v141_privacy_confirm.py
          python3 tools/test_v141_passive_wifi.py
          python3 tools/test_v141_pocket_mode.py
          python3 tools/test_desk_clock_format.py
          python3 tools/test_crowd_none.py
          python3 tools/test_fonts_bisect_a.py
          python3 tools/test_fonts_preview_stage_b.py
          python3 tools/test_fonts_live_render.py
          python3 tools/test_fonts_stage_d.py
          python3 tools/test_fonts_five_steps.py
          python3 tools/test_fonts_button_coverage.py
          python3 tools/test_hunt_footer_buttons.py
      - name: Reject oversized OTA images and mismatched LAB manifests
        run: |
          python3 tools/test_check_app_image_sizes.py
          python3 tools/test_verify_lab_site_partitions.py
          python3 tools/test_blackbox_ota_layout.py
      - name: Run host tests
        run: make -C test
      - name: Verify CYD32 native LCD transfer and one-time rotation clear
        run: python3 tools/test_cyd32_native_push.py

  emulator:
    # Cheap, and it catches the failure mode the merge introduced: the
    # emulator compiles the firmware's own sources against its shims, so a
    # change to a header signature breaks it here rather than the next time
    # somebody tries to render the README animation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the PC emulator
        run: make -C sim -j"$(nproc)"
      - name: Run UI screenshot regression suite
        run: make -C sim regression

  # This job runs ONLY after all PR Build jobs have succeeded.
  # It is the sole trigger for branch LAB publication; PR pushes themselves
  # cannot start release-flasher.yml. Never dispatch a production tag here.
  dispatch-lab-after-build:
    name: Dispatch LAB only after all Build checks pass
    needs: [firmware, tests, emulator]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'retrodroid32' && (startsWith(github.head_ref, 'lab/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'integrate/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the passing PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Dispatch same-SHA LAB after successful full Build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A LAB request must be an intentional PR change, not merely an
          # inherited file on master. Unrelated PRs must never publish LABs.
          if ! git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- .github/lab-build-request.txt \
             | grep -Fxq '.github/lab-build-request.txt'; then
            echo "::notice::No modified LAB request in PR; no publication."
            exit 0
          fi
          test -s .github/lab-build-request.txt
          label="$(head -n 1 .github/lab-build-request.txt | tr -cd 'A-Za-z0-9-' | tr 'A-Z' 'a-z' | cut -c1-40)"
          test -n "$label" || { echo "::error::LAB label is empty"; exit 1; }
          # Do not dispatch if a newer commit was pushed during this Build.
          latest_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$latest_sha" != "$PR_HEAD_SHA" ]; then
            echo "::notice::PR head changed during Build; newer run owns LAB dispatch."
            exit 0
          fi
          echo "::notice::Full Build passed for $PR_HEAD_SHA. Dispatching LAB $label."
          gh workflow run release-flasher.yml -R "$REPO" --ref "$PR_REF" \
            -f lab=true -f label="$label"
