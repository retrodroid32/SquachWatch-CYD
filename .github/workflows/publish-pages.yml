name: Publish web flasher

# Production Pages is deployed only from the exact site artifact produced by
# the release/lab workflow. A normal push to master may build and test firmware,
# but it cannot silently replace the public flasher with an unreleased build.
on:
  workflow_run:
    workflows:
      - "Build and release firmware"
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download exact tested site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site
          gh run download "${{ github.event.workflow_run.id }}" \
            -R "${{ github.repository }}" -n pages-site -D _site
          test -s _site/index.html
          test -s _site/boards.json
          test -s _site/versions.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
