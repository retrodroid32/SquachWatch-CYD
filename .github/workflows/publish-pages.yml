name: Publish web flasher

# Production Pages is deployed only from the exact site artifact produced by
# the release workflow. Ordinary master builds never publish the root site.
# Lab runs are safe because release-flasher.yml restores the current released
# root and adds lab assets beside it before producing pages-site.
on:
  workflow_run:
    workflows: ["Build and release firmware"]
    types: [completed]
  # LAB-only fallback when the workflow_run event fails before scheduling jobs.
  # This trigger exists ONLY on this unmerged PR198 LAB branch.
  push:
    branches:
      - lab/soi-audit-194-197-20261109
    paths:
      - .github/lab-pages-request.txt

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download exact validated site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          if [ "${{ github.event_name }}" = "push" ]; then
            # Immutable already-successful PR198 LAB artifact; no rebuild.
            RUN_ID=42670285271
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          gh run download "$RUN_ID" \
            -R "${{ github.repository }}" -n pages-site -D _site
          test -s _site/index.html
          test -s _site/boards.json
          test -s _site/versions.json
          test -s _site/update/index.html
          test -s _site/emulator/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
