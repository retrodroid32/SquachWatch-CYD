name: Build and release firmware

# Isolated one-shot trusted Pages-publish bridge. No firmware is compiled or
# released by this branch; its pages-site is assembled exclusively from
# previously successful, validated release and last deployed LAB runs.
on:
  push:
    branches:
      - lab/pages-only-v1-22-0-from-artifacts-20261104
    paths:
      - '.github/lab-build-request.txt'

permissions:
  contents: read
  actions: read

jobs:
  pages-site:
    runs-on: ubuntu-latest
    steps:
      - name: Download EXACT successful v1.22.0 release and last LAB artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site _previous
          gh run download 41832825743 -R "${{ github.repository }}" -n pages-site -D _site
          gh run download 41831683443 -R "${{ github.repository }}" -n pages-site -D _previous
          # Transfer only the existing experimental LAB files. Never replace
          # any production manifest, firmware or version-history file.
          find _previous -maxdepth 1 -type f -name 'lab-*' -exec cp -p {} _site/ \;
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("_site")
          for name in ["manifest-cyd.json","manifest-cyd32-st7798.json"]:
              m=json.loads((p/name).read_text())
              assert m.get("version")=="1.22.0",(name,m.get("version"))
              for build in m.get("builds",[]):
                  for part in build.get("parts",[]):
                      target=p/part["path"]
                      assert target.is_file() and target.stat().st_size>0,target
              print("Verified v1.22.0 production:",name)
          for path in ["index.html","boards.json","versions.json",
                       "update/index.html","emulator/index.html"]:
              assert (p/path).is_file(),path
          print("Preserved LAB files:",len(list(p.glob("lab-*"))))
          PY
      - name: Publish exact validated site artifact for normal default-branch Pages workflow
        uses: actions/upload-artifact@v7
        with:
          name: pages-site
          path: _site
          retention-days: 3
          if-no-files-found: error
